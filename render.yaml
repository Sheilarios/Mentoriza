# Despliegue con un clic en Render (https://render.com) → New → Blueprint → selecciona este repositorio.
# Crea la base de datos PostgreSQL y el servicio web (frontend + API) automáticamente.
databases:
  - name: mentoriza-db
    databaseName: mentoriza
    user: mentoriza
    plan: free

services:
  - type: web
    name: mentoriza
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mentoriza-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PAYMENTS_MODE
        value: demo
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@mentoriza.pe
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_UNI_ACCESS_CODE
        sync: false
      - key: DEMO_ACCOUNTS
        value: "true"
